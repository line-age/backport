[project]
name = "lineage-backport"
version = "0.1.0"
description = "Lineage import of existing spreadsheets and traces into store"
requires-python = ">=3.14"
dependencies = [
    "lineage-model",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-ulid>=3",
]

[project.scripts]
backport-natural-gas = "backport.natural_gas:main"
backport-natural-gas-check = "backport.natural_gas_check:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
# The published half of store (controlplane L-0002).
lineage-model = { git = "https://github.com/line-age/store", subdirectory = "model", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/backport"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]
